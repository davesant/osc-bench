# OSC-Bench harm registry: harm ids used in measures.yaml (risk / risk_any / risk_count / pc_risk_any conditions).
# Built 2026-09-30. See README.md for sources and caveats.
#
# Illegal harms follow Ofcom's Risk Assessment Guidance and Risk Profiles (updated 25 Jun 2026), which lists
# 17 numbered kinds (CSEA split into grooming / CSAM imagery / CSAM URLs) plus "18. Cyberflashing", and which
# groups "Encouraging or assisting suicide and serious self-harm" as one kind.
# legal_basis gives OSA Schedule 5/6/7 paragraphs from legislation.gov.uk (Sch 7 as amended by SI 2025/1352,
# in force 8 Jan 2026). Where a kind maps to only part of a paragraph, or where Ofcom's grouping was not
# confirmed paragraph-by-paragraph, status is uncertain.

- id: terrorism
  label: Terrorism
  kind: illegal
  legal_basis: "OSA Sch 5 (terrorism offences)"
  source: https://www.ofcom.org.uk/siteassets/resources/documents/online-safety/information-for-industry/illegal-harms/updates/risk-assessment-guidance-and-risk-profiles.pdf
  status: verified
- id: csea_grooming
  label: "Child sexual exploitation and abuse (CSEA): grooming"
  kind: illegal
  legal_basis: "OSA Sch 6 (CSEA offences) - grooming offences"
  source: https://www.ofcom.org.uk/siteassets/resources/documents/online-safety/information-for-industry/illegal-harms/updates/risk-assessment-guidance-and-risk-profiles.pdf
  status: verified
  note: "Codes refer to this kind as 'grooming' (ICU F1, F2, J1, J2). Search Codes Table C lists CSEA as one row."
- id: csea_image
  label: "CSEA: child sexual abuse material (CSAM) - imagery ('image-based CSAM' in the Codes)"
  kind: illegal
  legal_basis: "OSA Sch 6 (CSEA offences)"
  source: https://www.ofcom.org.uk/siteassets/resources/documents/online-safety/information-for-industry/illegal-harms/updates/risk-assessment-guidance-and-risk-profiles.pdf
  status: verified
- id: csea_urls
  label: "CSEA: child sexual abuse material (CSAM) - URLs"
  kind: illegal
  legal_basis: "OSA Sch 6 (CSEA offences)"
  source: https://www.ofcom.org.uk/siteassets/resources/documents/online-safety/information-for-industry/illegal-harms/updates/risk-assessment-guidance-and-risk-profiles.pdf
  status: verified
- id: hate
  label: Hate
  kind: illegal
  legal_basis: "OSA Sch 7 para 5 (Public Order Act 1986 ss18, 19, 21, 29B, 29C, 29E) and para 9 (Crime and Disorder Act 1998 ss31, 32)"
  source: https://www.legislation.gov.uk/ukpga/2023/50/schedule/7
  status: verified
  note: "Offence list per Ofcom search Codes Table C (9 Sep 2026 version); paragraph numbers per legislation.gov.uk."
- id: harassment
  label: "Harassment, stalking, threats and abuse"
  kind: illegal
  legal_basis: "OSA Sch 7 paras 3, 4, 6, 7, 8, 9, 10 (threats to kill; public order; harassment and stalking offences) - exact Ofcom mapping not confirmed"
  source: https://www.ofcom.org.uk/siteassets/resources/documents/online-safety/information-for-industry/illegal-harms/updates/risk-assessment-guidance-and-risk-profiles.pdf
  status: uncertain
  note: "Ofcom Table C says 'multiple provisions across four jurisdictions'; paragraph list not read from an Ofcom source. Sch 7 para 9 (racially/religiously aggravated offences) overlaps with hate."
- id: coercive_control
  label: Controlling or coercive behaviour
  kind: illegal
  legal_basis: "OSA Sch 7 para 11 (Serious Crime Act 2015 s76)"
  source: https://www.legislation.gov.uk/ukpga/2023/50/schedule/7
  status: verified
- id: intimate_image_abuse
  label: Intimate image abuse
  kind: illegal
  legal_basis: "OSA Sch 7 para 28A(b)-(d) (Sexual Offences Act 2003 ss66B, 66E, 66F) and para 31 (Abusive Behaviour and Sexual Harm (Scotland) Act 2016 s2)"
  source: https://www.legislation.gov.uk/ukpga/2023/50/schedule/7
  status: uncertain
  note: "Ofcom search Codes Table C (9 Sep 2026) lists SOA 2003 s66B and AB&SH(S)A 2016 s2. Sch 7 para 28A was inserted 8 Jan 2026 and amended 29 Jun 2026 (adding ss66E/66F); whether Ofcom treats ss66E/66F as part of this kind was not confirmed."
- id: cyberflashing
  label: Cyberflashing
  kind: illegal
  legal_basis: "OSA Sch 7 para 28A(a) (Sexual Offences Act 2003 s66A)"
  source: https://www.ofcom.org.uk/online-safety/illegal-and-harmful-content/statement-new-priority-offences-serious-self-harm-and-cyberflashing
  status: verified
  note: "New priority offence (SI 2025/1352, in force 8 Jan 2026). Ofcom statement 25 Jun 2026: 'a new, and separate, kind of illegal harm'. Listed as kind 18 in the updated risk assessment guidance. No in-force Code measure is conditioned on it yet; Ofcom's June 2026 draft consolidated ICU Code (not in force) adds it to ICU J1/J2."
- id: extreme_pornography
  label: Extreme pornography
  kind: illegal
  legal_basis: "OSA Sch 7 para 29 (Criminal Justice and Immigration Act 2008 s63)"
  source: https://www.legislation.gov.uk/ukpga/2023/50/schedule/7
  status: verified
