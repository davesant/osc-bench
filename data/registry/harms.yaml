  status: verified
- id: human_trafficking
  label: Human trafficking
  kind: illegal
  legal_basis: "OSA Sch 7 paras 24-26 (Modern Slavery Act 2015 s2 and Scottish/NI equivalents)"
  source: https://www.legislation.gov.uk/ukpga/2023/50/schedule/7
  status: verified
- id: unlawful_immigration
  label: Unlawful immigration
  kind: illegal
  legal_basis: "OSA Sch 7 para 23 (Immigration Act 1971 ss24, 25)"
  source: https://www.legislation.gov.uk/ukpga/2023/50/schedule/7
  status: verified
- id: fraud
  label: Fraud and financial offences
  kind: illegal
  legal_basis: "OSA Sch 7 paras 33-36 (Fraud Act 2006 ss2, 4, 7, 9; CJL(S)A 2010 s49(3); FSMA 2000 ss23-25; Financial Services Act 2012 ss89-90) - paragraph split not confirmed"
  source: https://www.legislation.gov.uk/ukpga/2023/50/schedule/7
  status: uncertain
  note: "legislation.gov.uk extraction grouped paras 29, 31-36 together; exact paragraph numbers for each Act not confirmed."
- id: proceeds_of_crime
  label: Proceeds of crime
  kind: illegal
  legal_basis: "OSA Sch 7 para 32 (Proceeds of Crime Act 2002 ss327-329) - paragraph number not confirmed"
  source: https://www.legislation.gov.uk/ukpga/2023/50/schedule/7
  status: uncertain
- id: drugs
  label: Drugs and psychoactive substances
  kind: illegal
  legal_basis: "OSA Sch 7 paras 12-13 (Misuse of Drugs Act 1971; Psychoactive Substances Act 2016)"
  source: https://www.legislation.gov.uk/ukpga/2023/50/schedule/7
  status: verified
- id: weapons
  label: Firearms, knives and other weapons
  kind: illegal
  legal_basis: "OSA Sch 7 paras 14-22"
  source: https://www.legislation.gov.uk/ukpga/2023/50/schedule/7
  status: verified
- id: suicide_self_harm
  label: Encouraging or assisting suicide and serious self-harm
  kind: illegal
  legal_basis: "OSA Sch 7 paras 1, 2 (Suicide Act 1961 s2; CJA (NI) 1966 s13) and para 2A (OSA s184, inserted 8 Jan 2026)"
  source: https://www.ofcom.org.uk/online-safety/illegal-and-harmful-content/statement-new-priority-offences-serious-self-harm-and-cyberflashing
  status: verified
  note: "Ofcom (25 Jun 2026) combined suicide and serious self-harm into one kind for risk assessment. The Codes in force on 30 Sep 2026 still name only 'encouraging or assisting suicide (or attempted suicide)' in ICU E1/J1/J2; code amendments to follow separately."
- id: foreign_interference
  label: Foreign interference
  kind: illegal
  legal_basis: "OSA Sch 7 para 37 (National Security Act 2023 s13)"
  source: https://www.legislation.gov.uk/ukpga/2023/50/schedule/7
  status: verified
