  label: Animal cruelty
  kind: illegal
  legal_basis: "OSA Sch 7 para 38 (Animal Welfare Act 2006 s4(1))"
  source: https://www.legislation.gov.uk/ukpga/2023/50/schedule/7
  status: verified

