- id: ICU C9
  code: ICU
  section: C
  title: Hash matching to detect and remove CSAM
  applies_if:
  - {users_over: 700000, risk: {harm: csea_image, min: high}}
  - {feature: file_sharing, risk: {harm: csea_image, min: high}}
  - {size: large, risk: {harm: csea_image, min: medium}}
  applies_text: 'This measure applies to a provider in respect of each service it provides that: (a) is at high risk of image-based CSAM, and: i) has more than 700,000 monthly active United Kingdom users (see paragraphs 5.7 to 5.10); or ii) is a file-storage and file-sharing service; or (b) is a large service and is at medium or high risk of image-based CSAM.'
  in_force: 2025-03-17
  source:
    url: *src1
    locator: s4 para ICU C9.1, p.25; index s3
  status: verified
  note: 'feature: file_sharing = ''file-storage and file-sharing service'' as defined in Codes Table A.'
- id: ICU C10
  code: ICU
  section: C
  title: Detect and remove content matching listed CSAM URLs
  applies_if:
  - {users_over: 700000, risk: {harm: csea_urls, min: high}}
  - {size: large, risk: {harm: csea_urls, min: medium}}
  applies_text: 'This measure applies to a provider in respect of each service it provides that: a) has more than 700,000 monthly active United Kingdom users (see paragraphs 5.7 to 5.10) and is at high risk of CSAM URLs; or b) is a large service and is at medium or high risk of CSAM URLs.'
  in_force: 2025-03-17
  source:
    url: *src1
    locator: s4 para ICU C10.1, p.29; index s3
  status: verified
- id: ICU C14
  code: ICU
  section: C
  title: Hash matching to detect intimate image abuse content
  applies_if:
  - {feature: visual_ugc, principal_purpose: pornography, risk: {harm: intimate_image_abuse, min: high}}
  - {feature: visual_ugc, users_over: 700000, risk: {harm: intimate_image_abuse, min: high}}
  - {feature: [visual_ugc, file_sharing], risk: {harm: intimate_image_abuse, min: high}}
  - {feature: visual_ugc, size: large, risk: {harm: intimate_image_abuse, min: medium}}
  applies_text: 'This measure applies to a provider in respect of each service it provides that enables regulated user-generated content in the form of photographs, videos or visual images (whether or not combined with written material) to be generated, uploaded or shared, and: (a) is at high risk of intimate image abuse, and: i) the principal purpose of the service is the hosting or dissemination of regulated pornographic content; ii) has more than 700,000 monthly active United Kingdom users (see paragraphs 5.7 to 5.10); or iii) is a file-storage and file-sharing service; or (b) is a large service and is at medium or high risk of intimate image abuse.'
  in_force: 2026-09-30
  source:
    url: *src1
    locator: s4 para ICU C14.1 (page not recorded); index s3 p.10
  status: verified
  note: 'Added by amendments issued 9 Sep 2026, in force 30 Sep 2026 (Codes cover: ''Incorporates amendments issued: 9 September 2026 / Incorporates amendments in force: 30 September 2026''; IIA statement page: ''issued 9 September 2026, in force 30 September 2026''). ICU C11-C13 are shown as intentionally blank in this version. Ofcom has separate guidance (9 Sep 2026) on the appropriate proportion of human review for IIA hash matching. The image-content condition governs all four clauses.'
- id: ICU C15
  code: ICU
  section: C
  title: Crisis response protocol
  applies_if:
  - {size: large, risk_any: {harms: [terrorism, hate, harassment, foreign_interference], min: medium}}
  - {risk_any: {harms: [terrorism, hate, harassment, foreign_interference], min: high}}
  applies_text: 'This measure applies to a provider in respect of each service it provides that meets either of the following conditions: (a) the service is a large service at medium risk of one or more of the following kinds of illegal harm: (i) terrorism; (ii) hate; (iii) harassment, stalking, threats and abuse; (iv) the foreign interference offence; or (b) the service is at high risk of one or more of the kinds of illegal harm listed in sub-paragraph (a).'
  in_force: null
  source:
    url: &src2 https://www.ofcom.org.uk/siteassets/resources/documents/online-safety/protecting-children/illegal-harms/draft-consolidated-illegal-content-codes-of-practice-for-user-to-user-services.pdf?v=419247
    locator: draft consolidated ICU Code (VERSION NOT IN FORCE), para ICU C15.1
  status: uncertain
  note: 'NOT in the 9 Sep 2026 amended Code (which runs C14 -> D1). Taken from Ofcom''s draft consolidated Code marked ''VERSION NOT IN FORCE''. Crisis response statement page (updated 18 Jun 2026): measures ''laid in parliament''; ''From Autumn, relevant providers will need to take the measures''. No in-force date found as of 30 Sep 2026. Clause (a) text says ''medium risk''; high risk at any size is covered by (b). C15.2 defines crisis as an extraordinary situation with a serious threat to public safety in the UK linked to a significant increase in relevant illegal content.'
- id: ICU C16
  code: ICU
  section: C
  title: 'Crisis response: dedicated law enforcement channel'
