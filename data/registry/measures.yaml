- id: ICU J1
  code: ICU
  section: J
  title: User blocking and muting
  applies_if:
  - {size: large, risk_any: {harms: [csea_grooming, suicide_self_harm, hate, harassment, coercive_control], min: medium}, feature: user_profiles, feature_any: [user_connection, posting_content, user_communication]}
  applies_text: 'This measure applies to a provider in respect of each large service it provides that meets all of the following conditions: (a) the service is at medium or high risk of one or more of the following kinds of illegal harm: (i) grooming; (ii) encouraging or assisting suicide (or attempted suicide); (iii) hate; (iv) harassment, stalking, threats and abuse; (v) controlling or coercive behaviour; (b) users of the service have user profiles; and (c) the service has at least one of the following functionalities: (i) user connection functionality; (ii) posting content functionality; (iii) user communication (including but not limited to: (1) direct messaging functionality; and (2) commenting on content).'
  in_force: 2025-03-17
  source:
    url: *src1
    locator: s4 para ICU J1.1, p.57; index s3
  status: verified
  note: user_communication includes direct_messaging and commenting. Ofcom's June 2026 draft consolidated Code (not in force) adds serious self-harm and cyberflashing to the harm list; Ofcom also consulted (Apr 2025) on extending J1/J2 to smaller services.
