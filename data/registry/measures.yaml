  applies_text: 'This measure applies to a provider in respect of each service it provides that is a large service at medium or high risk of one or more of the following kinds of illegal harm: (a) terrorism; (b) hate; (c) harassment, stalking, threats and abuse; (d) the foreign interference offence.'
  in_force: null
  source:
    url: *src2
    locator: draft consolidated ICU Code (VERSION NOT IN FORCE), para ICU C16.1
  status: uncertain
  note: 'As ICU C15: draft, laid June 2026, not in force in any Code version found; in_force unknown.'
