- id: ICU E1
  code: ICU
  section: E
  title: Safety metrics during on-platform recommender system testing
  applies_if:
  - {feature: recommender_testing, risk_count: {groups: [[terrorism], [csea_image, csea_urls], [suicide_self_harm], [hate], [harassment], [drugs], [extreme_pornography], [intimate_image_abuse], [foreign_interference]], min: medium, count: 2}}
  applies_text: 'This measure applies to a provider in respect of each service it provides that meets both of the following conditions: (a) the provider conducts on-platform testing of content recommender systems on the service; and (b) the service is at medium or high risk of the kinds of illegal harm specified in two or more of the following paragraphs: (i) terrorism; (ii) image-based CSAM or CSAM URLs; (iii) encouraging or assisting suicide (or attempted suicide); (iv) hate; (v) harassment, stalking, threats and abuse; (vi) drugs and psychoactive substances; (vii) extreme pornography; (viii) intimate image abuse; or (ix) the foreign interference offence.'
  in_force: 2025-03-17
  source:
    url: *src1
    locator: s4 para ICU E1.1, p.47; index s3
  status: verified
  note: In-force text names 'encouraging or assisting suicide (or attempted suicide)'; since the 25 Jun 2026 statement suicide and serious self-harm are assessed as one kind (harm id suicide_self_harm). Ofcom's June 2026 draft consolidated Code (not in force) reads '...suicide (or attempted suicide) and serious self-harm'.
